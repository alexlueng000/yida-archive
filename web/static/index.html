<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目档案 · 文件归档管理</title><style>
:root{--bg:#f5f6f8;--paper:#fefefe;--ink:#222c3c;--muted:#687589;--line:#e0e5ec;--accent:#285ecc;--soft:#edf3ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit}button,.button{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 16px;border-radius:7px;cursor:pointer;text-decoration:none;display:inline-block}button:hover,.button:hover{border-color:var(--accent);color:var(--accent)}button.primary{background:var(--accent);color:#fefefe;border-color:var(--accent)}button:disabled{opacity:.55;cursor:wait}input{padding:10px 12px;border:1px solid var(--line);border-radius:6px;min-width:0;background:var(--paper);color:var(--ink)}:focus-visible{outline:3px solid #9ebaff;outline-offset:2px}a{color:var(--accent)}.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}aside{padding:30px 20px;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:32px}.brand{font-size:21px;font-weight:700;letter-spacing:1px}.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:2px;font-weight:400;margin-top:5px}.nav{background:var(--soft);color:var(--accent);border:0;text-align:left}.aside-note{margin-top:auto;color:var(--muted);font-size:12px;line-height:1.9}main{padding:36px 40px;min-width:0;max-width:1600px;width:100%;margin:0 auto}.eyebrow{color:var(--muted);font-size:12px;margin-bottom:10px}.heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}h1{font-size:28px;line-height:1.3;margin:0 0 9px;font-weight:650}h2{font-size:17px;margin:0}p{margin:0;color:var(--muted)}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.summary{display:flex;gap:30px;padding:18px 0 26px;color:var(--muted);flex-wrap:wrap}.summary strong{font-size:21px;color:var(--ink);font-weight:600;margin-right:7px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}.panel-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 22px;border-bottom:1px solid var(--line)}.search{width:280px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{background:#f9fafc;color:var(--muted);font-size:12px;font-weight:500;padding:13px 22px}td{padding:18px 22px;border-top:1px solid var(--line)}tbody tr:hover{background:#fafbfe}.project-name{font-weight:600;color:var(--ink);text-decoration:none;font-size:15px;display:block}.sub{font-size:12px;color:var(--muted);margin-top:3px}.tag{font-size:12px;padding:3px 9px;border-radius:4px;background:#edf5f0;color:#237654}.tag.pending{background:#fbf1df;color:#936616}.empty{padding:60px 24px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:8px}.new-project{padding:24px;background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:24px}.fields{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:18px;margin:18px 0}.fields label{display:flex;flex-direction:column;gap:7px;color:var(--muted)}.notice{padding:12px 16px;border-radius:7px;background:#edf5f0;color:#237654;margin-bottom:20px;white-space:pre-wrap;overflow-wrap:anywhere}.notice.error{background:#fbecea;color:#9c3630}.upload{display:flex;align-items:center;justify-content:space-between;gap:20px;border:1px dashed #a9bbd9;border-radius:9px;background:#f6f9ff;padding:22px 26px;margin-bottom:24px}.upload.drag{background:#e6eeff;border-color:var(--accent)}.upload h2{margin-bottom:5px}.upload p{font-size:13px}.progress{margin-top:8px;color:var(--accent);font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:18px 22px;border-bottom:1px solid var(--line)}.tabs button{border:0;background:transparent;color:var(--muted);padding:6px 12px}.tabs button.active{background:var(--soft);color:var(--accent)}.file-name{max-width:460px;white-space:normal;overflow-wrap:anywhere;font-weight:500}.path{font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin-top:16px}.back{padding:0;background:none;border:0;color:var(--muted);margin-bottom:18px}[hidden]{display:none!important}.link-button{background:none;border:0;padding:0;color:var(--accent)}@media(max-width:1000px){.shell{grid-template-columns:170px 1fr}main{padding:28px 24px}aside{padding:28px 16px}.heading{align-items:flex-start}.fields{grid-template-columns:1fr 1fr}.fields label:last-child{grid-column:1/-1}}@media(max-width:680px){.shell{display:block}aside{padding:14px 20px;flex-direction:row;align-items:center;justify-content:space-between;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:18px}.brand small,.aside-note{display:none}main{padding:24px 16px}.heading,.upload,.panel-top{align-items:stretch;flex-direction:column}.search{width:100%}.summary{gap:12px 22px}h1{font-size:24px}.fields{grid-template-columns:1fr}.fields label:last-child{grid-column:auto}td,th{padding:14px 16px}.file-name{min-width:220px}}
</style></head><body><div class="shell"><aside><div class="brand">项目档案<small>PROJECT ARCHIVE</small></div><button class="nav" id="homeNav">▦ 所有项目</button><div class="aside-note">文件上传后自动分析归档<br>相同内容仅保存一份<br>未识别文件归入「未归类」</div></aside><main><div id="notice" class="notice" role="status" hidden></div>
<section id="home"><div class="eyebrow">工作空间 / 项目管理</div><div class="heading"><div><h1>所有项目</h1><p>按项目整理文件，每一份资料都有归处。</p></div><button class="primary" id="newBtn">＋ 新建项目</button></div><div class="summary" id="homeSummary"></div><form id="createForm" class="new-project" hidden><h2>新建项目</h2><div class="fields"><label>采购单位 *<input name="purchaser" required maxlength="120" placeholder="例如：深圳理工"></label><label>项目号 *<input name="project_no" required maxlength="120" placeholder="例如：B22026LD001"></label><label>项目名称<input name="name" maxlength="200" placeholder="便于识别的名称，可选"></label></div><div class="tools"><button class="primary" type="submit">创建并进入项目</button><button type="button" id="cancelCreate">取消</button></div></form><div class="panel"><div class="panel-top"><h2>项目列表</h2><input class="search" id="projectSearch" aria-label="搜索项目" placeholder="搜索项目名称、项目号或采购单位"></div><div id="projectList" class="table-wrap"></div></div></section>
<section id="detail" hidden><button class="back" id="backBtn">← 返回所有项目</button><div class="heading"><div><div class="eyebrow" id="projectMeta"></div><h1 id="projectTitle"></h1><p>上传文件，自动去重、分类并保存。</p></div><div class="tools"><button id="retryBtn">重新保存</button><a class="button" id="exportBtn">下载项目文件</a></div></div><div class="summary" id="detailSummary"></div><div class="upload" id="dropzone"><div><h2>上传到此项目</h2><p>拖入文件或点击选择，分析完成后自动保存，无需确认。单个文件最大 64 MB。</p><div class="progress" id="progress" role="status" aria-live="polite"></div></div><button class="primary" id="uploadBtn">＋ 选择文件</button><input id="fileInput" type="file" multiple hidden></div><div class="panel"><div class="panel-top"><h2>已保存文件</h2><input class="search" id="fileSearch" aria-label="搜索文件" placeholder="搜索文件名或原始文件名"></div><div class="tabs" id="folderTabs" aria-label="文件分类"></div><div class="table-wrap" id="fileList"></div></div><div class="path" id="savePath"></div></section></main></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let projects=[],current=null,files=[],folder='',busy=false;
const size=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';const date=n=>new Date(n).toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
function notice(message,error=false){$('notice').textContent=message;$('notice').className='notice'+(error?' error':'');$('notice').hidden=false}
async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const v=await r.json();if(!r.ok||v.error)throw new Error(v.error||'操作失败');return v}
function endpoint(action){return '/api/project/'+action+'?id='+encodeURIComponent(current.id)}function lock(on){busy=on;for(const id of ['uploadBtn','retryBtn','homeNav','backBtn','newBtn'])$(id).disabled=on;$('dropzone').setAttribute('aria-busy',String(on))}
async function home(){if(busy)return;$('notice').hidden=true;current=null;location.hash='';$('home').hidden=false;$('detail').hidden=true;try{const r=await api('/api/projects');projects=r.projects;renderProjects()}catch(e){notice(e.message,true)}}
function renderProjects(){const q=$('projectSearch').value.trim().toLowerCase(),list=projects.filter(p=>(p.name+' '+p.project_no+' '+p.purchaser).toLowerCase().includes(q));$('homeSummary').innerHTML=`<span><strong>${projects.length}</strong>个项目</span><span><strong>${projects.reduce((n,p)=>n+p.count,0)}</strong>份已保存文件</span><span><strong>${projects.reduce((n,p)=>n+p.pending,0)}</strong>份未归类文件</span>`;$('projectList').innerHTML=list.length?`<table><thead><tr><th>项目</th><th>采购单位</th><th>已保存文件</th><th>归档状态</th><th>最近更新</th><th></th></tr></thead><tbody>${list.map(p=>`<tr><td><a href="#project=${p.id}" data-project="${p.id}" class="project-name">${esc(p.name)}</a><div class="sub">${esc(p.project_no)}</div></td><td>${esc(p.purchaser)}</td><td>${p.count} 份 <span class="sub">· ${size(p.size)}</span></td><td><span class="tag ${p.pending?'pending':''}">${p.pending?p.pending+' 份未归类':p.count?'已归档':'待上传'}</span></td><td>${date(p.updated)}</td><td><button class="link-button" data-project="${p.id}">查看项目 →</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty"><strong>${q?'未找到匹配的项目':'开始整理第一个项目'}</strong>${q?'试试其他项目号或采购单位。':'点击「新建项目」，上传文件后即可自动归档。'}</div>`}
async function openProject(id){if(busy)return;try{const r=await api('/api/project/detail?id='+encodeURIComponent(id));current=r.project;folder='';$('fileSearch').value='';$('notice').hidden=true;$('home').hidden=true;$('detail').hidden=false;location.hash='project='+id;renderDetail(r)}catch(e){notice(e.message,true)}}
function renderDetail(r){files=r.files;$('projectTitle').textContent=current.name;$('projectMeta').textContent=current.purchaser+' / '+current.project_no;$('savePath').textContent='本地保存位置：'+r.path;$('exportBtn').href=endpoint('export');$('detailSummary').innerHTML=`<span><strong>${files.length}</strong>份已保存文件</span><span><strong>${files.filter(f=>f.folder!=='未归类').length}</strong>份已分类</span><span><strong>${r.pending}</strong>份未归类</span><span><strong>${size(files.reduce((n,f)=>n+f.size,0))}</strong>总大小</span>`;renderFiles()}
function renderFiles(){const folders=[...new Set(files.map(f=>f.folder))].sort();$('folderTabs').innerHTML=[['','全部文件'],...folders.map(f=>[f,f])].map(([id,label])=>`<button data-folder="${esc(id)}" class="${folder===id?'active':''}" aria-pressed="${folder===id}">${esc(label)} ${id?files.filter(f=>f.folder===id).length:files.length}</button>`).join('');const q=$('fileSearch').value.trim().toLowerCase(),list=files.filter(f=>(!folder||f.folder===folder)&&(f.name+' '+f.origin).toLowerCase().includes(q));$('fileList').innerHTML=list.length?`<table><thead><tr><th>文件名称</th><th>分类</th><th>大小</th><th>保存时间</th><th>操作</th></tr></thead><tbody>${list.map(f=>`<tr><td class="file-name">${esc(f.name)}${f.origin!==f.name?`<div class="sub">原文件：${esc(f.origin)}</div>`:''}</td><td><span class="tag ${f.folder==='未归类'?'pending':''}">${esc(f.folder)}</span>${f.type?`<div class="sub">${esc(f.type)}</div>`:''}</td><td>${size(f.size)}</td><td>${date(f.modified)}</td><td><a href="${endpoint('file')+'&path='+encodeURIComponent(f.path)}">下载</a></td></tr>`).join('')}</tbody></table>`:`<div class="empty"><strong>${files.length?'没有匹配的文件':'项目还没有保存文件'}</strong>${files.length?'调整分类或搜索条件后再试。':'上传后会在这里看到去重后的文件及分类结果。'}</div>`}
async function upload(selected){if(busy||!current||!selected.length)return;lock(true);$('notice').hidden=true;let added=0,rejected=[],errors=[];try{const accepted=[...selected].filter(f=>{if(f.size===0||f.size>64*1024*1024){rejected.push(f.name+'：'+(f.size===0?'空文件':'超过64 MB'));return false}return true});for(let i=0;i<accepted.length;i++){const f=accepted[i];$('progress').textContent=`正在处理 ${i+1} / ${accepted.length}：${f.name}，分析后自动保存…`;try{const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=()=>reject(new Error('读取文件失败'));reader.readAsDataURL(f)});const r=await api(endpoint('upload'),{name:'上传 '+date(Date.now()),files:[{name:f.name,data}]});added+=r.added;rejected.push(...r.skipped.map(s=>s.name+'：'+s.why));renderDetail(r)}catch(e){errors.push(f.name+'：'+e.message);break}}notice(`已完成 ${added} 个文件的自动归档。`+(rejected.length?'\n未上传：'+rejected.join('；'):'')+(errors.length?'\n'+errors.join('；')+'。剩余文件请重新上传。':''),Boolean(errors.length||rejected.length))}finally{lock(false);$('progress').textContent='';$('fileInput').value=''}}
$('homeNav').onclick=home;$('backBtn').onclick=home;$('newBtn').onclick=()=>{$('createForm').hidden=false;$('createForm').elements.purchaser.focus()};$('cancelCreate').onclick=()=>{$('createForm').hidden=true};$('projectSearch').oninput=renderProjects;$('fileSearch').oninput=renderFiles;$('projectList').onclick=e=>{const a=e.target.closest('[data-project]');if(a){e.preventDefault();openProject(a.dataset.project)}};$('folderTabs').onclick=e=>{const b=e.target.closest('[data-folder]');if(b){folder=b.dataset.folder;renderFiles()}};
$('createForm').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;try{const r=await api('/api/projects',Object.fromEntries(new FormData(e.target)));e.target.reset();e.target.hidden=true;await openProject(r.project.id)}catch(err){notice(err.message,true)}finally{btn.disabled=false}};$('uploadBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>upload(e.target.files);$('dropzone').ondragover=e=>{e.preventDefault();if(!busy)$('dropzone').classList.add('drag')};$('dropzone').ondragleave=()=>$('dropzone').classList.remove('drag');$('dropzone').ondrop=e=>{e.preventDefault();$('dropzone').classList.remove('drag');upload(e.dataTransfer.files)};
$('retryBtn').onclick=async()=>{if(busy)return;lock(true);$('progress').textContent='正在重新分析并保存项目文件…';try{const r=await api(endpoint('save'),{});renderDetail(r);notice('项目文件已保存。')}catch(e){notice(e.message,true)}finally{lock(false);$('progress').textContent=''}};window.addEventListener('beforeunload',e=>{if(busy){e.preventDefault();e.returnValue=''}});window.addEventListener('hashchange',()=>{if(busy)return;const id=new URLSearchParams(location.hash.slice(1)).get('project');if(id&&current?.id!==id)openProject(id);else if(!id&&current)home()});const initial=new URLSearchParams(location.hash.slice(1)).get('project');initial?openProject(initial):home();
</script></body></html>
