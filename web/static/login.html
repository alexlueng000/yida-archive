<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 项目档案</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f6f8;color:#222c3c;font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}.card{width:min(420px,calc(100% - 32px));background:white;border:1px solid #e0e5ec;border-radius:12px;padding:36px;box-shadow:0 12px 35px #1c35500c}small{color:#687589;letter-spacing:2px}h1{font-size:25px;margin:24px 0 6px}p{color:#687589;margin:0 0 24px}label{display:block;font-weight:600;margin:16px 0 6px}input{width:100%;padding:12px;border:1px solid #d9e0ea;border-radius:6px;font:inherit}button{width:100%;margin-top:24px;padding:12px;border:0;border-radius:6px;background:#285ecc;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.6}.error{color:#b42318;margin:12px 0 0} :focus-visible{outline:3px solid #9ebaff;outline-offset:2px}</style></head><body><main class="card"><strong>项目档案</strong><br><small>PROJECT ARCHIVE</small><h1 id="title">登录</h1><p id="description">请输入管理员账号和密码。</p><form id="form"><label for="username">账号</label><input id="username" autocomplete="username" required maxlength="80"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><p class="error" id="error" role="alert" hidden></p><button id="submit" type="submit">登录</button></form></main><script>
let setup=false;const $=id=>document.getElementById(id);async function init(){try{const r=await fetch('/api/auth/status');if(!r.ok)throw Error('无法读取登录状态');const s=await r.json();if(s.authenticated){location.replace('/');return}setup=!s.configured;if(setup){$('title').textContent='首次设置管理员';$('description').textContent='请设置本机管理员账号和密码，密码至少 8 位。';$('password').autocomplete='new-password';$('password').minLength=8;$('submit').textContent='设置并登录'}}catch(e){$('error').textContent=e.message;$('error').hidden=false;$('submit').disabled=true}}$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('error').hidden=true;try{const r=await fetch('/api/auth/'+(setup?'setup':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});const v=await r.json();if(!r.ok)throw Error(v.error||'登录失败');location.replace('/')}catch(e){$('error').textContent=e.message;$('error').hidden=false}finally{$('submit').disabled=false}};init();
</script></body></html>
